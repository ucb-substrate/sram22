name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

# A newer push to the same PR cancels its older runs; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always

jobs:
  check-workspace:
    name: Build, format, lint, and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        id: toolchain-nightly
        with:
          toolchain: nightly
          components: rustfmt
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          toolchain: stable
          components: clippy
      - name: Cache workspace
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.toolchain.outputs.cachekey }}
      - name: Check formatting
        run: |
          cargo +nightly fmt --check
      - name: Clippy
        run: make lint
      - name: Test
        run: make test
      - name: Fetch simulation models
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/ucb-substrate/skywater-pdk.git "$RUNNER_TEMP/sky130-models"
          git -C "$RUNNER_TEMP/sky130-models" checkout 6fcd983f8be885bd831551a8daad7b4f1657f33e
          git -C "$RUNNER_TEMP/sky130-models" submodule update --init libraries/sky130_fd_pr/latest
          echo "SKY130_OPEN_PDK_ROOT=$RUNNER_TEMP/sky130-models" >> "$GITHUB_ENV"
      - name: Simulate with external models
        run: cargo test --locked --release --lib blocks::coarse_tdc::tests::test_coarse_tdc_sim -- --ignored --exact

  published-macros:
    # Regenerates every macro in ucb-substrate/sram22_sky130_macros and checks that its
    # GDS (geometry and labels), LEF, Verilog and SPICE are unchanged. See
    # scripts/check_published_macros.py for exactly what is compared.
    name: Published macros unchanged
    runs-on: ubuntu-22.04
    env:
      # Show the check's progress as it happens, not when the step ends.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check out the published macros
        uses: actions/checkout@v4
        with:
          repository: ucb-substrate/sram22_sky130_macros
          path: published-macros
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - name: Cache workspace
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.toolchain.outputs.cachekey }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KLayout
        run: pip install klayout==0.30.12
      - name: Build sram22
        run: cargo build --locked --release --bin sram22
      - name: Self-test the comparisons
        run: >-
          python scripts/check_published_macros.py --self-test
          --sram22 target/release/sram22 --catalog published-macros
          --out "$RUNNER_TEMP/self-test"
      - name: Regenerate and compare all published macros
        run: >-
          python scripts/check_published_macros.py
          --sram22 target/release/sram22 --catalog published-macros
          --out "$RUNNER_TEMP/macros" --jobs "$(nproc)"
      - name: Upload generator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: published-macro-logs
          path: ${{ runner.temp }}/macros/*/gen.log
