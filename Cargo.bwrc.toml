[package]
name = "sram22"
version = "0.2.0"
edition = "2021"
authors = ["Rahul Kumar <rahulkumar@berkeley.edu>", "Rohan Kumar <rohankumar@berkeley.edu>"]
description = "A configurable SRAM generator"
repository = "https://github.com/rahulk29/sram22"
license = "BSD-3-Clause"

[dependencies]
derive_builder = "0.12"
grid = "0.9"
thiserror = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_repr = "0.1"
serde_json = "1"
toml = "0.5"
log = "0.4"
indicatif = "0.17"
clap = { version = "4", features = ["derive"] }
itertools = "0.10"
arcstr = "1"
anyhow = "1"
calibre = { git = "ssh://git@bwrcrepo.eecs.berkeley.edu/rahulkumar/calibre.git", branch = "master", optional = true }
abstract_lef = { git = "ssh://git@bwrcrepo.eecs.berkeley.edu/rahulkumar/abstract_lef.git", branch = "master", optional = true }
liberate_mx = { git = "ssh://git@bwrcrepo.eecs.berkeley.edu/rahulkumar/liberate-mx.git", branch = "master", optional = true }
tera = "1"
lazy_static = "1"
colored = "2"
approx = "0.5"
lef21 = { git = "https://github.com/dan-fritchman/Layout21.git", branch = "main" }
plotters = "0.3.7"
regex = "1"
bitvec = "1"
slotmap = "1"

# Substrate 1 dependencies are retained only for layout generation.
# Schematics, design scripts, simulation and verification use Substrate 2
# or standalone tool drivers. Substrate 1 is renamed to `substrate1`
# so that Substrate 2 can own the `substrate` crate name.
#
# IMPORTANT: keep the Substrate 2 `substrate` entry *after* `substrate1`.
# The Substrate 2 derive macros locate the `substrate` crate through
# `proc-macro-crate`, which resolves duplicate package names by taking the
# last matching dependency in this manifest.
substrate1 = { package = "substrate", git = "https://github.com/ucb-substrate/substrate", branch = "main" }
subgeom = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
sky130_open_pdk = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
sky130_commercial_pdk = { git = "https://github.com/ucb-substrate/substrate", branch = "main", optional = true }

# Substrate 2 dependencies (schematic generation, netlisting, simulation).
substrate = { git = "https://github.com/ucb-substrate/substrate2", branch = "main" }
sky130 = { git = "https://github.com/ucb-substrate/substrate2", branch = "main" }
ngspice = { git = "https://github.com/ucb-substrate/substrate2", branch = "main" }
spice = { git = "https://github.com/ucb-substrate/substrate2", branch = "main" }
nutlex = { git = "https://github.com/ucb-substrate/substrate2", branch = "main" }
scir = { git = "https://github.com/ucb-substrate/substrate2", branch = "main" }
spectre = { git = "https://github.com/ucb-substrate/substrate2", branch = "main", optional = true }

rust_decimal = "1"
rust_decimal_macros = "1"

[dev-dependencies]
tempfile = "3"
paste = "1"
rayon = "1"

[features]
spectre = ["dep:spectre"]
commercial = ["dep:calibre", "dep:abstract_lef", "dep:liberate_mx", "spectre", "dep:sky130_commercial_pdk"]
default = ["commercial"]
